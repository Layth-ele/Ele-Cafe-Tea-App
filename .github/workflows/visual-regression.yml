name: Visual Regression

# Phase 0 fix: the previous version had broken YAML indentation
# (extra spaces under `with:`, leading-space `run:` lines) that
# would have prevented this workflow from ever running. The rewrite
# preserves the original intent — auth-bearing projects added by
# Phase 0.4 are now also part of the suite when secrets are present.

on:
  pull_request:
    paths:
      - 'src/**/*.{tsx,ts,css}'
      - 'src/styles/**'
      - 'tests/visual/**'
      - 'playwright.config.ts'
      - 'playwright.setup.ts'
      - 'package.json'
      - '.github/workflows/visual-regression.yml'
  workflow_dispatch: {}

concurrency:
  # Cancel older in-flight runs of the same PR.
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Job-level env so step `if:` conditions can read these — see
    # comment on the same pattern in a11y.yml. Step-level `env:` is
    # applied AFTER the if: condition is evaluated, so the gating
    # check has to read from job env.
    env:
      PLAYWRIGHT_TEST_LOGIN: ${{ secrets.PLAYWRIGHT_TEST_LOGIN }}
      PLAYWRIGHT_BASE_URL:   ${{ secrets.PLAYWRIGHT_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so diffs against the base branch render correctly
          # if you ever add a "compare vs main" step.
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Playwright browsers are big — cache them between runs.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install system deps for cached browsers
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Public-pages projects always run. Auth-bearing projects only
      # run when secrets are configured (i.e. on the canonical CI
      # pipeline against the test Firebase project, not on PRs from
      # forks). Setting AUTH_FIXTURE=skip prevents playwright.setup.ts
      # from attempting to mint custom tokens it can't reach.
      - name: Run visual tests (public)
        run: npm run test:visual -- --project=desktop --project=mobile
        env:
          CI: true
          AUTH_FIXTURE: skip
          VITE_FIREBASE_API_KEY: "ci-placeholder"
          VITE_FIREBASE_AUTH_DOMAIN: "ci.example.com"
          VITE_FIREBASE_PROJECT_ID: "ci-placeholder"
          VITE_FIREBASE_APP_ID: "ci-placeholder"

      - name: Run visual tests (auth-bearing)
        if: ${{ env.PLAYWRIGHT_TEST_LOGIN != '' }}
        run: npm run test:visual -- --project=user-state --project=user-state-mobile --project=admin-state
        env:
          CI: true
          # PLAYWRIGHT_TEST_LOGIN + PLAYWRIGHT_BASE_URL inherited from job env above.
          VITE_FIREBASE_API_KEY: ${{ secrets.TEST_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.TEST_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.TEST_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.TEST_FIREBASE_APP_ID }}

      # On failure, upload the HTML report + screenshots so the PR
      # reviewer can download and inspect the diff visually.
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
